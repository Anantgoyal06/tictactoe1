<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Game</title>
  <style>
    /* Design System Variables */
    :root {
      /* Primitive Color Tokens */
      --color-white: rgba(255, 255, 255, 1);
      --color-black: rgba(0, 0, 0, 1);
      --color-cream-50: rgba(252, 252, 249, 1);
      --color-cream-100: rgba(255, 255, 253, 1);
      --color-gray-200: rgba(245, 245, 245, 1);
      --color-gray-300: rgba(167, 169, 169, 1);
      --color-gray-400: rgba(119, 124, 124, 1);
      --color-slate-500: rgba(98, 108, 113, 1);
      --color-brown-600: rgba(94, 82, 64, 1);
      --color-charcoal-700: rgba(31, 33, 33, 1);
      --color-charcoal-800: rgba(38, 40, 40, 1);
      --color-slate-900: rgba(19, 52, 59, 1);
      --color-teal-300: rgba(50, 184, 198, 1);
      --color-teal-400: rgba(45, 166, 178, 1);
      --color-teal-500: rgba(33, 128, 141, 1);
      --color-teal-600: rgba(29, 116, 128, 1);
      --color-teal-700: rgba(26, 104, 115, 1);
      --color-teal-800: rgba(41, 150, 161, 1);
      --color-red-400: rgba(255, 84, 89, 1);
      --color-red-500: rgba(192, 21, 47, 1);
      --color-orange-400: rgba(230, 129, 97, 1);
      --color-orange-500: rgba(168, 75, 47, 1);

      /* RGB versions for opacity control */
      --color-brown-600-rgb: 94, 82, 64;
      --color-teal-500-rgb: 33, 128, 141;
      --color-slate-900-rgb: 19, 52, 59;
      --color-slate-500-rgb: 98, 108, 113;
      --color-red-500-rgb: 192, 21, 47;
      --color-red-400-rgb: 255, 84, 89;
      --color-orange-500-rgb: 168, 75, 47;
      --color-orange-400-rgb: 230, 129, 97;

      /* Semantic Color Tokens (Light Mode) */
      --color-background: var(--color-cream-50);
      --color-surface: var(--color-cream-100);
      --color-text: var(--color-slate-900);
      --color-text-secondary: var(--color-slate-500);
      --color-primary: var(--color-teal-500);
      --color-primary-hover: var(--color-teal-600);
      --color-primary-active: var(--color-teal-700);
      --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
      --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
      --color-secondary-active: rgba(var(--color-brown-600-rgb), 0.25);
      --color-border: rgba(var(--color-brown-600-rgb), 0.2);
      --color-btn-primary-text: var(--color-cream-50);
      --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
      --color-card-border-inner: rgba(var(--color-brown-600-rgb), 0.12);
      --color-error: var(--color-red-500);
      --color-success: var(--color-teal-500);
      --color-warning: var(--color-orange-500);
      --color-info: var(--color-slate-500);
      --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);

      /* Typography */
      --font-family-base: "FKGroteskNeue", "Geist", "Inter", -apple-system,
        BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-size-xs: 11px;
      --font-size-sm: 12px;
      --font-size-base: 14px;
      --font-size-md: 14px;
      --font-size-lg: 16px;
      --font-size-xl: 18px;
      --font-size-2xl: 20px;
      --font-size-3xl: 24px;
      --font-size-4xl: 30px;
      --font-weight-normal: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 550;
      --font-weight-bold: 600;
      --line-height-tight: 1.2;
      --line-height-normal: 1.5;
      --letter-spacing-tight: -0.01em;

      /* Spacing */
      --space-0: 0;
      --space-4: 4px;
      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-20: 20px;
      --space-24: 24px;
      --space-32: 32px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-base: 8px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04),
        0 2px 4px -1px rgba(0, 0, 0, 0.02);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04),
        0 4px 6px -2px rgba(0, 0, 0, 0.02);

      /* Animation */
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);

      /* Game-specific colors */
      --color-player-x: var(--color-teal-500);
      --color-player-o: var(--color-orange-500);
    }

    /* Dark mode colors */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-gray-400-rgb: 119, 124, 124;
        --color-teal-300-rgb: 50, 184, 198;
        --color-gray-300-rgb: 167, 169, 169;
        --color-gray-200-rgb: 245, 245, 245;

        --color-background: var(--color-charcoal-700);
        --color-surface: var(--color-charcoal-800);
        --color-text: var(--color-gray-200);
        --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
        --color-primary: var(--color-teal-300);
        --color-primary-hover: var(--color-teal-400);
        --color-primary-active: var(--color-teal-800);
        --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
        --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
        --color-secondary-active: rgba(var(--color-gray-400-rgb), 0.3);
        --color-border: rgba(var(--color-gray-400-rgb), 0.3);
        --color-error: var(--color-red-400);
        --color-success: var(--color-teal-300);
        --color-warning: var(--color-orange-400);
        --color-info: var(--color-gray-300);
        --color-focus-ring: rgba(var(--color-teal-300-rgb), 0.4);
        --color-btn-primary-text: var(--color-slate-900);
        --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
        --color-card-border-inner: rgba(var(--color-gray-400-rgb), 0.15);

        --color-player-x: var(--color-teal-300);
        --color-player-o: var(--color-orange-400);
      }
    }

    @font-face {
      font-family: 'FKGroteskNeue';
      src: url('https://r2cdn.perplexity.ai/fonts/FKGroteskNeue.woff2')
        format('woff2');
    }

    /* Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: var(--font-size-base);
      font-family: var(--font-family-base);
      line-height: var(--line-height-normal);
      color: var(--color-text);
      background-color: var(--color-background);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-24);
    }

    /* Game Container */
    .game-container {
      background-color: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-card-border);
      box-shadow: var(--shadow-lg);
      padding: var(--space-32);
      max-width: 500px;
      width: 100%;
    }

    /* Header */
    .game-header {
      text-align: center;
      margin-bottom: var(--space-32);
    }

    .game-title {
      font-size: var(--font-size-4xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
      margin-bottom: var(--space-12);
      letter-spacing: var(--letter-spacing-tight);
    }

    .game-status {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      min-height: 28px;
      transition: color var(--duration-normal) var(--ease-standard);
    }

    .game-status.winner {
      color: var(--color-success);
      font-weight: var(--font-weight-bold);
    }

    .game-status.draw {
      color: var(--color-warning);
      font-weight: var(--font-weight-bold);
    }

    /* Game Board */
    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-12);
      margin-bottom: var(--space-32);
      aspect-ratio: 1;
    }

    .cell {
      background-color: var(--color-secondary);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-standard);
      user-select: none;
      aspect-ratio: 1;
    }

    .cell:hover:not(.cell--filled):not(.cell--disabled) {
      background-color: var(--color-secondary-hover);
      border-color: var(--color-primary);
      transform: scale(1.05);
    }

    .cell:active:not(.cell--filled):not(.cell--disabled) {
      background-color: var(--color-secondary-active);
      transform: scale(0.98);
    }

    .cell--filled {
      cursor: not-allowed;
    }

    .cell--disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .cell--x {
      color: var(--color-player-x);
    }

    .cell--o {
      color: var(--color-player-o);
    }

    .cell--winning {
      background-color: var(--color-secondary-active);
      animation: pulse 0.6s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }

    /* Reset Button */
    .reset-button {
      width: 100%;
      padding: var(--space-16) var(--space-24);
      background-color: var(--color-primary);
      color: var(--color-btn-primary-text);
      border: none;
      border-radius: var(--radius-base);
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      font-family: var(--font-family-base);
      cursor: pointer;
      transition: all var(--duration-normal) var(--ease-standard);
    }

    .reset-button:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .reset-button:active {
      background-color: var(--color-primary-active);
      transform: translateY(0);
    }

    .reset-button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px var(--color-focus-ring);
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .game-container {
        padding: var(--space-24);
      }

      .game-title {
        font-size: var(--font-size-3xl);
      }

      .game-status {
        font-size: var(--font-size-lg);
      }

      .cell {
        font-size: 36px;
      }

      .game-board {
        gap: var(--space-8);
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="game-header">
      <h1 class="game-title">Tic Tac Toe</h1>
      <div class="game-status" id="gameStatus">Player X's turn</div>
    </div>

    <div class="game-board" id="gameBoard">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <button class="reset-button" id="resetButton">Reset Game</button>
  </div>

  <script>
    // Game State
    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let gameActive = true;

    // Winning combinations (indices of board array)
    const winningCombinations = [
      [0, 1, 2], // Top row
      [3, 4, 5], // Middle row
      [6, 7, 8], // Bottom row
      [0, 3, 6], // Left column
      [1, 4, 7], // Middle column
      [2, 5, 8], // Right column
      [0, 4, 8], // Diagonal top-left to bottom-right
      [2, 4, 6]  // Diagonal top-right to bottom-left
    ];

    // DOM Elements
    const cells = document.querySelectorAll('.cell');
    const gameStatus = document.getElementById('gameStatus');
    const resetButton = document.getElementById('resetButton');

    // Initialize game
    function initGame() {
      cells.forEach(cell => {
        cell.addEventListener('click', handleCellClick);
      });
      resetButton.addEventListener('click', resetGame);
    }

    // Handle cell click
    function handleCellClick(event) {
      const cell = event.target;
      const index = parseInt(cell.getAttribute('data-index'));

      // Prevent clicking on filled cells or when game is inactive
      if (board[index] !== '' || !gameActive) {
        return;
      }

      // Update game state
      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.classList.add('cell--filled');
      cell.classList.add(currentPlayer === 'X' ? 'cell--x' : 'cell--o');

      // Check for winner or draw
      if (checkWinner()) {
        endGame(false);
      } else if (checkDraw()) {
        endGame(true);
      } else {
        // Switch player
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }

    // Check if current player has won
    function checkWinner() {
      for (let combination of winningCombinations) {
        const [a, b, c] = combination;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          // Highlight winning cells
          highlightWinningCells(combination);
          return true;
        }
      }
      return false;
    }

    // Check if game is a draw
    function checkDraw() {
      return board.every(cell => cell !== '');
    }

    // Highlight winning cells
    function highlightWinningCells(combination) {
      combination.forEach(index => {
        cells[index].classList.add('cell--winning');
      });
    }

    // End game
    function endGame(isDraw) {
      gameActive = false;
      cells.forEach(cell => cell.classList.add('cell--disabled'));

      if (isDraw) {
        gameStatus.textContent = "It's a draw!";
        gameStatus.classList.add('draw');
      } else {
        gameStatus.textContent = `Player ${currentPlayer} wins!`;
        gameStatus.classList.add('winner');
      }
    }

    // Update game status
    function updateStatus() {
      gameStatus.textContent = `Player ${currentPlayer}'s turn`;
      gameStatus.classList.remove('winner', 'draw');
    }

    // Reset game
    function resetGame() {
      // Reset game state
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      gameActive = true;

      // Reset cells
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('cell--filled', 'cell--x', 'cell--o', 'cell--disabled', 'cell--winning');
      });

      // Reset status
      updateStatus();
    }

    // Start the game
    initGame();
  </script>
</body>
</html>
